name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            package: sql-connector-macos-x86_64
            archive: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            package: sql-connector-macos-aarch64
            archive: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            package: sql-connector-windows-x86_64
            archive: zip
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.96.1 --profile minimal --target "${{ matrix.target }}"

      - name: Package macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/package-macos.sh "${{ matrix.target }}" .

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Target "${{ matrix.target }}" -OutputDirectory .

      - name: Upload unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: |
            ${{ matrix.package }}.${{ matrix.archive }}
            ${{ matrix.package }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create unsigned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
