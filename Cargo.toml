[workspace]
members = [
    "apps/sql-connector",
    "crates/connector-core",
    "crates/connector-policy",
    "crates/connector-store",
    "crates/connector-ipc",
    "crates/connector-runtime",
    "crates/connector-mcp",
    "crates/connector-control",
    "crates/connectors-document",
    "crates/connectors-http",
    "crates/connectors-timeseries",
    "crates/connectors-sql",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
repository = "https://github.com/example/sql-connector"

[workspace.dependencies]
async-trait = "0.1.89"
anyhow = "1.0.100"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
ciborium = "0.2.2"
clap = { version = "4.5.50", features = ["derive"] }
directories = "6.0.0"
csv = "1.4.0"
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde"] }
globset = "0.4.18"
hex = "0.4.3"
prost = "0.14.1"
percent-encoding = "2.3.2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
rmcp = { version = "=2.2.0", features = ["transport-io"] }
schemars = "1.2.2"
rand = "0.8.5"
rusqlite = { version = "0.37.0", features = ["bundled"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.145"
sha2 = "0.10.9"
snap = "1.1.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.16", features = ["codec"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4", "v7"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
