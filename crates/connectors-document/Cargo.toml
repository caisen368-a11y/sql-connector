[package]
name = "connectors-document"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["mongodb", "cassandra", "couchbase", "hbase"]
mongodb = ["dep:moka", "dep:mongodb", "dep:rustls", "dep:tempfile"]
cassandra = [
    "dep:bigdecimal",
    "dep:moka",
    "dep:num-bigint",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:scylla",
    "dep:webpki-roots",
]
couchbase = ["dep:couchbase", "dep:futures", "dep:moka"]
hbase = ["dep:moka", "dep:thrift"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
bigdecimal = { version = "0.4.10", optional = true }
chrono.workspace = true
connector-core = { path = "../connector-core" }
couchbase = { version = "=1.0.1", optional = true }
futures = { version = "0.3.31", optional = true }
mongodb = { version = "3.8.0", optional = true }
moka = { version = "=0.12.15", optional = true, features = ["sync"] }
num-bigint = { version = "0.4.6", optional = true }
percent-encoding.workspace = true
rustls = { version = "0.23.35", optional = true, default-features = false, features = ["ring", "std"] }
rustls-pemfile = { version = "2.2.0", optional = true }
scylla = { version = "1.7.0", optional = true, features = ["rustls-023", "full-serialization"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tempfile = { version = "3.23.0", optional = true }
thrift = { version = "=0.24.0", optional = true }
url.workspace = true
uuid.workspace = true
webpki-roots = { version = "1.0.3", optional = true }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winnt"] }
windows-acl = "0.3.0"

[lints]
workspace = true
