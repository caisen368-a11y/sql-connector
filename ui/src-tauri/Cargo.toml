[package]
name = "sql-agent"
version = "0.1.1"
description = "Desktop database assistant powered by sql-connector"
edition = "2024"

[lib]
name = "sql_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10.3"
chrono = { version = "0.4.41", features = ["serde"] }
futures-util = "0.3.31"
rand = "0.8.5"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
rmcp = { version = "=2.2.0", default-features = false, features = ["client", "transport-child-process"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2", features = [] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.7"
uuid = { version = "1.19.0", features = ["serde", "v7"] }
zeroize = "1.8.2"

[workspace]
